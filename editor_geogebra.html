<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor GeoGebra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        h1 { color: #fff; font-weight: 700; }
        h1 i { color: #00f2ff; margin-right: 0.5rem; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.3)); }
        #ggb-element {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.08);
            max-width: 100%;
        }
    </style>
</head>
<body>

<div id="app-navbar"></div>

<div class="container py-4">
    <div class="glass-card">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
                <h1><i class="fas fa-pencil-ruler"></i> Construcción GeoGebra</h1>
                <p style="color:rgba(255,255,255,0.35); font-size:0.9rem; margin-bottom:1rem;">
                    Clase: <span id="nombre-clase" style="color:#00f2ff;">—</span><br>
                    Creá tu construcción y luego enviásela a tu profesor/a.
                </p>
            </div>
            <a href="./panel_alumno.html" id="btn-volver" class="btn-neon-outline">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>

        <div id="editor-alertas" class="mb-3"></div>
        <div id="ggb-element" class="mb-3"></div>

        <form id="form-trabajo" class="row g-3" novalidate>
            <div class="col-md-8">
                <label for="titulo" class="form-label"><i class="fas fa-heading me-1"></i> Título del trabajo</label>
                <input type="text" id="titulo" class="form-control" placeholder="Ej: Teorema de Pitágoras" required>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn-neon w-100" id="btn-enviar">
                    <i class="fas fa-paper-plane"></i> Guardar y Enviar
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./config-db.js?v=1"></script>
<script src="./cloud.js?v=5"></script>
<script src="./db.js?v=7"></script>
<script src="./utils.js?v=4"></script>
<script src="./auth.js?v=4"></script>
<script>
    (function () {
        'use strict';

        var sesion = GGS_LAYOUT.requerir();
        if (!sesion) {
            return;
        }

        GGS_LAYOUT.renderNav('editor');

        var alertas = document.getElementById('editor-alertas');
        var form = document.getElementById('form-trabajo');
        var btnVolver = document.getElementById('btn-volver');
        var claseId = Number(new URLSearchParams(window.location.search).get('clase_id')) || 0;
        var clase = null;
        var ggbApplet = null;

        if (sesion.rol === 'profesor') {
            btnVolver.href = './panel_profesor.html?clase_id=' + claseId;
        } else if (sesion.rol === 'administrador') {
            btnVolver.href = './configuracion.html';
        }

        function mostrarAlerta(mensaje, tipo) {
            GGS_UTILS.mostrarAlerta(alertas, mensaje, tipo);
        }

        form.classList.add('d-none');
        GGS_UTILS.mostrarAlerta(alertas, 'Cargando datos de la clase...', 'info');

        function iniciarEditor() {
            alertas.textContent = '';
            clase = claseId ? GGS_DB.getClasePorId(claseId) : null;

            if (!clase) {
                mostrarAlerta('Falta el ID de la clase o la clase no existe.', 'danger');
                return;
            }

            if (sesion.rol === 'alumno' && !GGS_DB.estaInscripto(claseId, sesion.usuario_id)) {
                mostrarAlerta('No estás inscripto en esta clase. Volvé al panel y unite con el código de acceso.', 'danger');
                return;
            }

            document.getElementById('nombre-clase').textContent = clase.nombre_clase;
            form.classList.remove('d-none');

            ggbApplet = new GGBApplet({
                "appName": "classic",
                "width": 800,
                "height": 600,
                "showToolBar": true,
                "showMenuBar": true,
                "showAlgebraInput": true,
                "showResetIcon": true,
                "enableLabelDrags": false,
                "enableShiftDragZoom": true,
                "enableRightClick": false,
                "scaleContainerClass": "ggb-element"
            }, true);

            ggbApplet.inject('ggb-element');

            form.addEventListener('submit', function (evento) {
                evento.preventDefault();

                var btn = document.getElementById('btn-enviar');
                var titulo = document.getElementById('titulo').value.trim();

                if (!titulo) {
                    mostrarAlerta('El título es obligatorio.', 'danger');
                    return;
                }

                if (!ggbApplet) {
                    mostrarAlerta('El editor todavía no está listo. Esperá unos segundos e intentá de nuevo.', 'danger');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando…';

                function restaurarBoton() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Guardar y Enviar';
                }

                try {
                    ggbApplet.getBase64(function (base64String) {
                        if (!base64String || base64String.length < 50) {
                            mostrarAlerta('No hay construcción para guardar. Creá algo en el lienzo primero.', 'danger');
                            restaurarBoton();
                            return;
                        }

                        GGS_DB.guardarTrabajo({
                            clase_id: claseId,
                            alumno_id: sesion.usuario_id,
                            titulo_trabajo: titulo,
                            ggb_base64: base64String
                        }).then(function () {
                            mostrarAlerta('Trabajo enviado correctamente. Ya podés verlo en tu panel.', 'success');
                            form.reset();
                            ggbApplet.reset();
                        }).catch(function (error) {
                            mostrarAlerta('Error al guardar: ' + error.message, 'danger');
                        }).then(restaurarBoton);
                    });
                } catch (error) {
                    mostrarAlerta('El editor todavía no está listo. Esperá unos segundos e intentá de nuevo.', 'danger');
                    restaurarBoton();
                }
            });
        }

        Promise.resolve(GGS_DB.ready)
            .then(iniciarEditor)
            .catch(function (error) {
                mostrarAlerta('No se pudieron cargar los datos de la clase: ' + error.message, 'danger');
            });
    })();
</script>
</body>
</html>
