<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel — Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
</head>
<body>

<div id="app-navbar"></div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="glass-card">
                <h4><i class="fas fa-door-open"></i> Unirse a una Clase</h4>
                <div id="alumno-alertas" class="mb-3"></div>
                <form id="form-unirse" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="codigo-acceso"><i class="fas fa-key me-1"></i> Código de acceso</label>
                        <input type="text" id="codigo-acceso" class="form-control text-uppercase" placeholder="Ej: AX93L2" maxlength="6"
                               style="font-family:'Courier New',monospace; letter-spacing:3px; text-align:center; font-size:1.3rem;" required>
                    </div>
                    <button type="submit" class="btn-neon w-100"><i class="fas fa-right-to-bracket me-1"></i> Unirme</button>
                </form>
                <p class="mt-2 mb-0" style="color:rgba(255,255,255,0.2); font-size:0.75rem; text-align:center;">
                    Pedile el código a tu profesor/a. Las clases se sincronizan entre dispositivos.
                </p>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-card">
                <h4><i class="fas fa-book"></i> Mis Clases</h4>
                <div id="lista-clases"><p class="text-muted mt-2 mb-0" style="font-size:0.9rem;">Cargando clases...</p></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./config-db.js?v=1"></script>
<script src="./cloud.js?v=5"></script>
<script src="./db.js?v=7"></script>
<script src="./utils.js?v=4"></script>
<script src="./auth.js?v=4"></script>
<script>
    (function () {
        'use strict';

        var sesion = GGS_LAYOUT.requerir(['alumno']);
        if (!sesion) {
            return;
        }

        GGS_LAYOUT.renderNav('panel_alumno');

        var alertas = document.getElementById('alumno-alertas');
        var lista = document.getElementById('lista-clases');
        var inputCodigo = document.getElementById('codigo-acceso');

        function mostrarAlerta(mensaje, tipo) {
            GGS_UTILS.mostrarAlerta(alertas, mensaje, tipo);
        }

        function renderClases() {
            var clases = GGS_DB.getClasesDeAlumno(sesion.usuario_id);

            if (!clases.length) {
                lista.innerHTML =
                    '<div class="empty-state">' +
                        '<i class="fas fa-school"></i>' +
                        '<p>No estás inscripto en ninguna clase todavía.</p>' +
                    '</div>';
                return;
            }

            var filas = clases.map(function (clase) {
                var idClase = Number(clase.id) || 0;
                var trabajos = GGS_DB.getTrabajosDeAlumnoEnClase(idClase, sesion.usuario_id);
                var idColapso = 'trabajos-' + idClase;
                var tema = clase.tema ?
                    '<div class="profesor-label"><i class="fas fa-tag"></i> ' + GGS_UTILS.escapeHtml(clase.tema) + '</div>' : '';
                var botonEntregas = '';
                var entregas = '';

                if (trabajos.length) {
                    botonEntregas =
                        '<button class="btn-neon-sm" style="border-color:rgba(0,242,255,0.08); background:rgba(0,242,255,0.03);" type="button"' +
                        ' data-bs-toggle="collapse" data-bs-target="#' + idColapso + '" aria-expanded="false" aria-controls="' + idColapso + '">' +
                            '<i class="fas fa-history"></i> Ver entregas (' + trabajos.length + ')' +
                        '</button>';

                    entregas =
                        '<div class="collapse mt-2" id="' + idColapso + '">' +
                            trabajos.map(function (trabajo) {
                                return '<div style="font-size:0.8rem; padding:0.3rem 0.5rem; border-left:2px solid rgba(0,242,255,0.15); margin-bottom:0.3rem;">' +
                                    '<span style="color:#00f2ff;">' + GGS_UTILS.escapeHtml(trabajo.titulo_trabajo) + '</span>' +
                                    '<small style="color:rgba(255,255,255,0.25); display:block;">' + GGS_UTILS.formatFecha(trabajo.fecha_entrega) + '</small>' +
                                '</div>';
                            }).join('') +
                        '</div>';
                }

                return '<tr>' +
                    '<td>' +
                        '<strong style="color:#fff;">' + GGS_UTILS.escapeHtml(clase.nombre_clase) + '</strong>' +
                        '<span class="codigo-badge ms-1">' + GGS_UTILS.escapeHtml(clase.codigo_acceso) + '</span>' +
                        tema +
                    '</td>' +
                    '<td class="profesor-label"><i class="fas fa-chalkboard-teacher"></i> ' + GGS_UTILS.escapeHtml(clase.profesor_nombre) + '</td>' +
                    '<td>' +
                        '<a href="./editor_geogebra.html?clase_id=' + idClase + '" class="btn-neon-sm mb-1">' +
                            '<i class="fas fa-pen"></i> Construir' +
                        '</a> ' +
                        botonEntregas +
                        entregas +
                    '</td>' +
                '</tr>';
            }).join('');

            lista.innerHTML =
                '<div class="glass-table">' +
                    '<table class="table">' +
                        '<thead><tr><th>Clase</th><th>Profesor</th><th>Acción</th></tr></thead>' +
                        '<tbody>' + filas + '</tbody>' +
                    '</table>' +
                '</div>';
        }

        inputCodigo.addEventListener('input', function () {
            inputCodigo.value = inputCodigo.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        });

        document.getElementById('form-unirse').addEventListener('submit', function (evento) {
            evento.preventDefault();

            var codigo = inputCodigo.value.trim();

            if (!codigo) {
                mostrarAlerta('Ingresá un código.', 'danger');
                return;
            }

            var boton = document.querySelector('#form-unirse button[type="submit"]');
            var contenidoBoton = boton ? boton.innerHTML : '';

            if (boton) {
                boton.disabled = true;
                boton.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Buscando...';
            }

            GGS_DB.unirseAClase(codigo, sesion.usuario_id)
                .then(function (resultado) {
                    if (resultado.ok) {
                        mostrarAlerta('Te uniste a "' + resultado.clase.nombre_clase + '" correctamente.', 'success');
                        inputCodigo.value = '';
                        renderClases();
                        return;
                    }

                    if (resultado.motivo === 'duplicado') {
                        mostrarAlerta('Ya estás inscripto en "' + resultado.clase.nombre_clase + '".', 'warning');
                    } else if (resultado.motivo === 'almacenamiento') {
                        mostrarAlerta('No se pudo guardar la inscripción. Revisá el almacenamiento del navegador.', 'danger');
                    } else if (!resultado.totalClases) {
                        var diagnostico = GGS_DB.getDiagnostico();
                        var lugar = window.location.protocol === 'file:' ? 'archivo local (file://)' : diagnostico.origen;

                        console.info('[GGS] Diagnóstico de almacenamiento:', diagnostico);

                        if (diagnostico.nubeActiva) {
                            mostrarAlerta('No existe ninguna clase con ese código en el servidor. Verificá que sea el de 6 caracteres.', 'danger');
                        } else if (diagnostico.nubeConfigurada) {
                            mostrarAlerta('No se pudo conectar con el servidor JSON. Revisá la URL, la conexión a internet y los límites del servicio.', 'danger');
                        } else {
                            mostrarAlerta('No hay clases guardadas en este navegador (' + lugar + '). Configurá la URL del servidor JSON en config-db.js para compartir entre dispositivos.', 'danger');
                        }
                    } else {
                        mostrarAlerta('Código inválido. Verificá que sea el de 6 caracteres y que la clase siga existiendo.', 'danger');
                    }
                })
                .catch(function (error) {
                    mostrarAlerta('No se pudo unir a la clase: ' + error.message, 'danger');
                })
                .then(function () {
                    if (boton) {
                        boton.disabled = false;
                        boton.innerHTML = contenidoBoton;
                    }
                });
        });

        if (window.location.protocol === 'file:') {
            mostrarAlerta('Estás abriendo la app como archivo local. Publicá la app en Render o usá un servidor HTTP para compartir las clases.', 'danger');
        }

        Promise.resolve(GGS_DB.ready)
            .then(function (sincronizado) {
                if (GGS_DB.nubeConfigurada() && !sincronizado) {
                    mostrarAlerta('No se pudo sincronizar con el servidor JSON. Revisá config-db.js y tu conexión a internet.', 'danger');
                }

                renderClases();
            })
            .catch(function (error) {
                mostrarAlerta('No se pudieron cargar las clases: ' + error.message, 'danger');
                renderClases();
            });

        GGS_UTILS.escucharCambios(renderClases);
    })();
</script>
</body>
</html>
