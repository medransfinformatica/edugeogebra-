<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración — Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
</head>
<body>

<div id="app-navbar"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card">
                <h2><i class="fas fa-cog"></i> Configuración de la Institución</h2>
                <p style="color:rgba(255,255,255,0.3); font-size:0.9rem; margin-bottom:1.5rem;">
                    <i class="fas fa-shield-alt"></i> Solo visible para administradores.
                </p>

                <div id="config-alertas" class="mb-3"></div>

                <form id="form-config" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="nombre_escuela"><i class="fas fa-school me-1"></i> Nombre de la escuela</label>
                            <input type="text" id="nombre_escuela" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="nombre_sistema"><i class="fas fa-tag me-1"></i> Nombre del sistema</label>
                            <input type="text" id="nombre_sistema" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="telefono"><i class="fas fa-phone me-1"></i> Teléfono</label>
                            <input type="text" id="telefono" class="form-control" placeholder="Ej: 1234-5678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email_institucional"><i class="fas fa-envelope me-1"></i> Email institucional</label>
                            <input type="email" id="email_institucional" class="form-control" placeholder="ej: escuela@educacion.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="direccion"><i class="fas fa-map-pin me-1"></i> Dirección</label>
                            <input type="text" id="direccion" class="form-control" placeholder="Ej: Av. Siempreviva 742">
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn-neon"><i class="fas fa-save me-1"></i> Guardar Cambios</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./config-db.js?v=1"></script>
<script src="./cloud.js?v=5"></script>
<script src="./db.js?v=7"></script>
<script src="./utils.js?v=4"></script>
<script src="./auth.js?v=4"></script>
<script>
    (function () {
        'use strict';

        var sesion = GGS_LAYOUT.requerir(['administrador']);
        if (!sesion) {
            return;
        }

        GGS_LAYOUT.renderNav('configuracion');

        var campos = ['nombre_escuela', 'nombre_sistema', 'telefono', 'email_institucional', 'direccion'];
        var alertas = document.getElementById('config-alertas');
        var form = document.getElementById('form-config');
        var config = GGS_DB.getConfig();

        campos.forEach(function (campo) {
            document.getElementById(campo).value = config[campo] || '';
        });

        function mostrarAlerta(mensaje, tipo) {
            GGS_UTILS.mostrarAlerta(alertas, mensaje, tipo);
        }

        form.addEventListener('submit', function (evento) {
            evento.preventDefault();

            var datos = {};
            campos.forEach(function (campo) {
                datos[campo] = document.getElementById(campo).value.trim();
            });

            if (!datos.nombre_escuela || !datos.nombre_sistema) {
                mostrarAlerta('Los campos Nombre de la escuela y Nombre del sistema son obligatorios.', 'danger');
                return;
            }

            try {
                GGS_DB.guardarConfig(datos);
                mostrarAlerta('Configuración guardada correctamente.', 'success');
                GGS_LAYOUT.renderNav('configuracion');
            } catch (error) {
                mostrarAlerta(error.message, 'danger');
            }
        });
    })();
</script>
</body>
</html>
