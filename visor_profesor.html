<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de trabajos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        h1 { color: #fff; font-weight: 700; font-size: 1.4rem; }
        h1 i { color: #00f2ff; margin-right: 0.5rem; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.3)); }
        .meta-text { color: rgba(255, 255, 255, 0.3); font-size: 0.85rem; }
        #ggb-element {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.08);
            max-width: 100%;
        }
    </style>
</head>
<body>

<div id="app-navbar"></div>

<div class="container py-4">
    <div class="glass-card" id="visor-card">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h1 style="margin:0;"><i class="fas fa-eye"></i> <span id="titulo-trabajo">Trabajo</span></h1>
                <div class="meta-text mt-1" id="meta-trabajo"></div>
            </div>
            <a href="./panel_profesor.html" id="btn-volver" class="btn-neon-outline">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
        <div id="ggb-element" class="mb-3"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./config-db.js?v=1"></script>
<script src="./cloud.js?v=6"></script>
<script src="./db.js?v=7"></script>
<script src="./utils.js?v=4"></script>
<script src="./auth.js?v=4"></script>
<script>
    (function () {
        'use strict';

        var sesion = GGS_LAYOUT.requerir();
        if (!sesion) {
            return;
        }

        GGS_LAYOUT.renderNav('visor');

        var id = Number(new URLSearchParams(window.location.search).get('id')) || 0;
        var btnVolver = document.getElementById('btn-volver');
        var contenedorGgb = document.getElementById('ggb-element');

        contenedorGgb.innerHTML =
            '<div class="empty-state">' +
                '<i class="fas fa-spinner fa-spin"></i>' +
                '<p>Cargando trabajo...</p>' +
            '</div>';

        function renderTrabajo() {
            var trabajo = id ? GGS_DB.getTrabajo(id) : null;

            if (!trabajo) {
                document.title = 'Visor — Trabajo no encontrado';
                document.getElementById('titulo-trabajo').textContent = 'Trabajo no encontrado';
                document.getElementById('meta-trabajo').textContent = 'El trabajo solicitado no existe o fue eliminado.';
                contenedorGgb.innerHTML =
                    '<div class="empty-state">' +
                        '<i class="fas fa-draw-polygon"></i>' +
                        '<p>No hay datos para mostrar.</p>' +
                    '</div>';
                btnVolver.href = sesion.rol === 'profesor' ? './panel_profesor.html' :
                    (sesion.rol === 'alumno' ? './panel_alumno.html' : './configuracion.html');
                return;
            }

            document.title = 'Visor — ' + trabajo.titulo_trabajo;
            document.getElementById('titulo-trabajo').textContent = trabajo.titulo_trabajo;
            document.getElementById('meta-trabajo').textContent =
                GGS_UTILS.formatFecha(trabajo.fecha_entrega) + ' | ID #' + Number(trabajo.id);

            btnVolver.href = sesion.rol === 'profesor' ? './panel_profesor.html?clase_id=' + Number(trabajo.clase_id) :
                (sesion.rol === 'alumno' ? './panel_alumno.html' : './configuracion.html');

            if (!trabajo.ggb_base64 || trabajo.ggb_base64.length < 50) {
                contenedorGgb.innerHTML =
                    '<div class="empty-state">' +
                        '<i class="fas fa-draw-polygon"></i>' +
                        '<p>El trabajo no contiene datos de construcción.</p>' +
                    '</div>';
                return;
            }

            var ggbApplet = new GGBApplet({
                "appName": "classic",
                "width": 800,
                "height": 600,
                "showToolBar": true,
                "showMenuBar": true,
                "showAlgebraInput": true,
                "enableLabelDrags": false,
                "enableShiftDragZoom": true,
                "enableRightClick": false,
                "enableFileFeatures": false,
                "scaleContainerClass": "ggb-element",
                "ggbBase64": trabajo.ggb_base64
            }, true);

            ggbApplet.inject('ggb-element');
        }

        Promise.resolve(GGS_DB.ready)
            .then(renderTrabajo)
            .catch(renderTrabajo);
    })();
</script>
</body>
</html>
